name: "Build PR DMG"

on:
  pull_request_target:
    types:
      - labeled

jobs:
  build:
    name: "Build PR artifact"
    if: github.event.label.name == 'buildable'
    runs-on: macos-15

    env:
      XCODE_PATH: "/Applications/Xcode_16.app"
      PROJECT_NAME: "Device Compliance Troubleshooter"
      SCHEME: "Device Compliance Troubleshooter"
      APP_NAME: "Device Compliance Troubleshooter"

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install app signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.APP_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APP_CERTIFICATE_P12_PASSWORD }}

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project "Device Compliance Troubleshooter.xcodeproj" \
            -scheme "Device Compliance Troubleshooter" \
            clean build analyze \
            -configuration Release \
            -derivedDataPath DerivedData \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Locate app
        run: |
          set -euo pipefail

          APP_PATH="$(find "${GITHUB_WORKSPACE}/DerivedData/Build/Products/Release" -maxdepth 1 -name "*.app" | head -n 1)"

          if [ -z "${APP_PATH}" ]; then
            echo "No .app found"
            exit 1
          fi

          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"

      - name: Setup notarization
        run: |
          "${{ env.XCODE_PATH }}/Contents/Developer/usr/bin/notarytool" store-credentials \
            --key /dev/stdin \
            --key-id "${{ secrets.NOTARY_AUTH_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_UUID }}" \
            default <<< "${{ secrets.NOTARY_AUTH_KEY }}"

      - name: Resolve Developer ID identity for DMG signing
        env:
          DEV_APPLICATION_CERT_CN: ${{ secrets.DEV_APPLICATION_CERT_CN }}
        run: |
          set -euo pipefail
          if [ -n "${DEV_APPLICATION_CERT_CN}" ]; then
            echo "Using repository secret DEV_APPLICATION_CERT_CN."
            echo "CODESIGN_IDENTITY=${DEV_APPLICATION_CERT_CN}" >> "$GITHUB_ENV"
          else
            IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            if [ -z "${IDENTITY}" ]; then
              echo "No Developer ID Application identity found. Set secret DEV_APPLICATION_CERT_CN or import a valid P12."
              security find-identity -v -p codesigning || true
              exit 1
            fi
            echo "Resolved identity from keychain: ${IDENTITY}"
            echo "CODESIGN_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"
          fi

      - name: Create DMG
        run: |
          set -euo pipefail

          mkdir -p dmg-root
          cp -R "${{ env.APP_PATH }}" "dmg-root/${{ env.APP_NAME }}.app"

          DMG_PATH="${GITHUB_WORKSPACE}/${{ env.APP_NAME }}-PR.dmg"

          hdiutil create \
            -volname "${{ env.APP_NAME }}" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"

          codesign --force --sign "${{ env.CODESIGN_IDENTITY }}" --timestamp "${DMG_PATH}"

          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_ENV"

      - name: Notarize DMG
        run: |
          set -euo pipefail

          xattr -rc "${{ env.DMG_PATH }}"

          "${{ env.XCODE_PATH }}/Contents/Developer/usr/bin/notarytool" submit \
            "${{ env.DMG_PATH }}" \
            --keychain-profile "default" \
            --wait

          "${{ env.XCODE_PATH }}/Contents/Developer/usr/bin/stapler" staple "${{ env.DMG_PATH }}"

      - name: Upload PR artifact
        uses: actions/upload-artifact@v7
        with:
          name: PR-DMG
          path: ${{ env.DMG_PATH }}
          retention-days: 7
